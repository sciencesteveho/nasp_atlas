cohort_id: psychad
population_id: myeloid_ad
source_notes: >-
  "Plasticity of human microglia and brain perivascular macrophages in aging
  and Alzheimer's disease" (Nature Genetics 2026,
  doi:10.1038/s41588-026-02716-6; CELLxGENE collection
  f6ea32cb-a10e-46ba-ba39-38d469c9cade), dataset "Frozen in silico sorted
  myeloid single nuclei RNA-seq from human prefrontal cortex"
  (09642770-9a4c-4fe6-9f45-67e1249adc33): 10x 3' v3 snRNA-seq of
  dorsolateral prefrontal cortex from the PsychAD cohort, 289,279 myeloid
  nuclei from 1,469 donors in three brain banks (MSSM, RADC, HBCC). The
  nuclei are a myeloid partition of PsychAD primary datasets, so all are
  flagged is_primary_data false for that reason only and are not filtered on
  it. Arms join the author AD and Control flags: AD (AD = 1, any
  comorbidity; 560 donors) versus controls without a neuropsychiatric or
  neurodegenerative diagnosis (AD = 0, Control = 1; 292 donors). The other
  617 donors (other diagnoses; HBCC donors have no AD call) are in no arm.
  AD donors are older and more often female, so age, sex, ancestry and
  brain bank are covariates. A third of AD donors (193) and 56 controls are
  recorded as "90 year-old and over"; their age is top-coded at 90 rather
  than dropping them. Each donor's nuclei were split across two multiplexed
  pools (technical replicates), so a sample is the donor. Cell types are
  the author myeloid subclasses (homeostatic, adaptive, ADAM and exAM
  microglia, proliferating microglia, perivascular macrophages); subtypes
  are kept as fine cell types. Raw counts are in raw/X.
