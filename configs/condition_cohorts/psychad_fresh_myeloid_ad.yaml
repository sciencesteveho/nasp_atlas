cohort_id: psychad
population_id: fresh_myeloid_ad
source_notes: >-
  "Plasticity of human microglia and brain perivascular macrophages in aging
  and Alzheimer's disease" (Nature Genetics 2026,
  doi:10.1038/s41588-026-02716-6; CELLxGENE collection
  f6ea32cb-a10e-46ba-ba39-38d469c9cade), dataset "Fresh ex vivo myeloid
  single cell RNA-seq from human prefrontal cortex"
  (440da0a0-f321-4f40-9080-bb04031681e5): scRNA-seq of 543,012 myeloid
  cells sorted fresh from dorsolateral prefrontal cortex at autopsy, 137
  donors from two brain banks (VA, RS), mostly 10x 3' v3 (16 donors 10x 3'
  v2). It complements the frozen-nuclei population of the same paper:
  whole cells detect cytoplasmic transcripts better, but fresh dissociation
  induces an ex vivo activated microglia state (exAM) that is an artefact of
  processing. Arms come from the author dx column: Alzheimer's disease (58)
  versus controls (39); donors with other CNS disorders (40) are in no arm.
  Age (top-coded at 90: 32 AD donors and 11 controls are recorded as "90
  year-old and over"), sex, brain bank, assay and post-mortem interval are
  covariates. A secondary slope per Braak stage within both arms tracks
  tau pathology. Each donor gave one sample. Cell types are the author
  myeloid subclasses; subtypes are kept as fine cell types. Raw counts are
  in raw/X.
input_filename: 21a0c6d5-658c-434e-a479-1e51504aec5c.h5ad
