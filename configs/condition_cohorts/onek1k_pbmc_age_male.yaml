cohort_id: onek1k
population_id: pbmc_age_male
source_notes: >-
  OneK1K (Yazar et al., Science 2022, doi:10.1126/science.abf3041; CELLxGENE
  dataset 3faad104-2ab8-4434-816d-474d8d2641db), restricted to male donors:
  416 donors (young 48, middle 121, old 247). Identical to onek1k_pbmc_age (same input, cell
  types, age groups and pool covariate) except for the sex filter; sex is
  constant within the stratum and is not a covariate. This and
  onek1k_pbmc_age_female are the two strata of a fully sex-interacted age
  model: the sex difference in an age slope is the female minus male
  estimate, with a standard error combining the two independent HC3
  standard errors. Tests whether ageing effects, such as the reported
  female-biased ISG+ monocyte expansion, differ by sex. X-linked genes that
  escape inactivation differ in level between sexes, not necessarily in
  slope. Raw counts are in X; a sample is the donor.
