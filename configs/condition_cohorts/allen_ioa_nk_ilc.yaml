cohort_id: allen_ioa
population_id: nk_ilc
source_notes: >-
  Allen Institute Immunobiology of Aging cohort (Nature 2025,
  doi:10.1038/s41586-025-09686-5; CELLxGENE collection
  60a2676d-9f37-46cc-9b02-c7370a53be9c): 10x Flex (probe-based) scRNA-seq of
  PBMCs from 234 healthy adults aged 40 to 89+, one Day-0 draw each. This
  population is the "NK cells and ILCs" lineage file (dataset
  946dc63a-760c-4a6c-9ed1-aa2f640d5183, 560,959 cells), a partition of the
  primary "All cells" dataset ff4235bb-1cdf-4dcf-a13a-dc4f32244400; its cells
  are flagged is_primary_data false for that reason only and are not filtered
  on it. Latent CMV expands adaptive (NKG2C+) NK cells, which sit inside the
  CD56dim NK cell type here, so a CD56dim difference can reflect that subset
  shift; adaptive NK cells are also present in many CMV-negative donors.
  Arms, covariates and exclusions are those of allen_ioa_myeloid: arms come
  from the author serology column subject.cmv and one Equivocal donor is in
  no arm; nine donors aged "89+" have no exact age and are excluded; age,
  sex, ancestry and processing batch (17 batch-pools) are covariates; a
  sample is one specimen. Sensors without probes are reported as not
  measured. Raw counts are in raw/X.
input_filename: f0bc2082-70fa-4ae6-94b6-026c865e02a1.h5ad
source_url: https://datasets.cellxgene.cziscience.com/f0bc2082-70fa-4ae6-94b6-026c865e02a1.h5ad
input_sha256: "28d097665b022ef00c885313ac8a1b2c840e3e1835cb801b0beddf57a103673e"
counts_source: raw/X
gene_id_column: _index
gene_symbol_column: feature_name
modality: cells
sample_columns: [specimen.specimenGuid]
obs_columns:
  donor_id: donor_id
  cell_type: AIFI_L2
  fine_cell_type: AIFI_L3
  cell_state: AIFI_L3
  ontology_cell_type: cell_type
  assay: assay
  tissue: tissue
  sex: sex
  development_stage: development_stage
  age: sample.subjectAgeAtDraw
  ancestry: subject.race
  batch: batch_id
filters:
  sex: [female, male]
condition:
  column: subject.cmv
  levels:
    cmv_negative: [Negative]
    cmv_positive: [Positive]
  reference: cmv_negative
covariates:
  age_years: {column: age, kind: numeric}
  sex: {column: sex, kind: categorical}
  ancestry: {column: ancestry, kind: categorical}
  batch: {column: batch, kind: categorical}
contrasts:
  - {estimand: cmv_positive_vs_negative, target: cmv_positive, reference: cmv_negative, role: primary}
continuous_contrasts:
  # Inflammaging: change per decade of age at draw within both serostatus
  # arms (age is the measurement here, so it is not also a covariate).
  - {estimand: age_slope, column: age, kind: numeric, arms: [cmv_negative, cmv_positive], step: 10, role: secondary}
cell_state:
  # ISG+ versus GZMK- CD56dim NK cells of the same donor (CD56dim NK cell type
  # only). ISG+ cells were defined from interferon-stimulated genes, so ISG
  # sensors are expected to differ.
  column: cell_state
  reference: "GZMK- CD56dim NK cell"
  altered: ["ISG+ CD56dim NK cell"]
