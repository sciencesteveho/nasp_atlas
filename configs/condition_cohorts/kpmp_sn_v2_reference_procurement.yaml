cohort_id: kpmp_sn_v2
population_id: reference_procurement
source_notes: >-
  KPMP/HuBMAP Human Kidney Atlas v2.0 single-nucleus RNA-seq, CELLxGENE
  dataset 7ff0197b-d175-49bf-b4fa-150fe0995d93. Healthy reference donors
  only, compared by how the tissue was obtained. Needle biopsies of living
  donors are the baseline. The living-donor pre-perfusion contrast tests the
  assumption behind pooling the two living-biopsy references in the primary
  population; the nephrectomy and deceased-donor contrasts estimate how
  surgical and post-mortem procurement shift sensors and IFN, ISR and SASP
  programs, which matters because Tabula Sapiens donors are deceased.
  Collection methods also differ in region, age and assay, which are
  adjusted. A sensitivity analysis, not a disease contrast.
